docs: https://attestazione.spaziogenesi.org/en/developer/
note: >-
  Two independent ceilings apply and they are documented in different places. (1) A per-IP request rate
  limit, stated inline in the OpenAPI 429 response descriptions for each operation. (2) A per-credential
  monthly attestation QUOTA attached to the pricing tier, documented on the developer and terms pages.
  A credential raises the quota; it does NOT raise the per-IP rate limit — the contract says so explicitly.
headers:
  observed: []
  documented: []
  retry_after: false
  probe:
    url: https://imgauth.spaziogenesi.org/api/status
    http_status: 200
    checked: '2026-08-11'
    result: >-
      No RateLimit-*, X-RateLimit-* or Retry-After header on a live 200. The response carries only cache,
      CORS and security headers. An agent therefore cannot see how close it is to the ceiling and has no
      published backoff hint — it can only react to a 429 after the fact. This is the single clearest
      runtime-semantics gap in an otherwise well-documented API.
limit_count: 3
