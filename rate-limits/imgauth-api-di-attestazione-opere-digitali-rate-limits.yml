verification_is_free: >-
  Verification operations (POST /api/verify, GET /api/ots, GET /api/cert, GET /c/<hash>, the badges) carry
  no quota at any tier — only the per-IP rate limit. The provider states verification is always free and
  unlimited for anyone.
