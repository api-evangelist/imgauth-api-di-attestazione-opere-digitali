    window: request
    unit: MB
    note: >-
      legacy inline-base64 path only; exceeding it returns 413. The client-side-hash path has no
      server-side size ceiling (the browser imposes ~1 GB, the CLI none).
    status_on_exhaustion: 413
quotas:
