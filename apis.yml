name: imgauth — API di attestazione opere digitali
description: >-
  Digital-work attestation and proof-of-existence service by Spazio Genesi ETS. Clients compute a SHA-256 fingerprint
  locally (file bytes never leave the device) and receive a signed PDF certificate, an RFC 3161 timestamp, and an
  OpenTimestamps/Bitcoin anchor. Exposes a public REST API (OpenAPI 3.0.3) and a hosted remote MCP server for agents.
