name: imgauth — API di attestazione opere digitali
description: >-
  Digital-work attestation and proof-of-existence service operated by Spazio Genesi ETS, an Italian
  non-profit (third-sector entity). The client computes a SHA-256 fingerprint locally and sends only the
  64-hex hash — file bytes never leave the device. The service binds that fingerprint to a signed
  server-side timestamp (HMAC), issues a PAdES B-LT signed PDF certificate carrying an RFC 3161 timestamp
  from an Adobe AATL-recognised TSA, and anchors the fingerprint in Bitcoin through OpenTimestamps across
  four independent calendars. Verification is free and unlimited for anyone, and the proof of existence
  never expires. Exposes an 18-operation public REST API (OpenAPI 3.0.3, served at the API host root), a
  hosted zero-install remote MCP server whose eight tools answer tools/list anonymously, an sg-attest CLI,
  a GitHub Action, embeddable SVG badges and three CORS-open public status endpoints. The API contract is
  in Italian by design. Positioned explicitly as a NON-QUALIFIED attestation under eIDAS 2.0.
url: https://raw.githubusercontent.com/api-evangelist/imgauth-api-di-attestazione-opere-digitali/refs/heads/main/apis.yml
