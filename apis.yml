apis:
- name: imgauth Remote MCP Server
  description: >-
    Hosted, zero-install MCP server (Streamable HTTP, protocol 2025-06-18) exposing the attestation service
    to MCP-capable agents. The eight tools were read live from tools/list on 2026-08-11: service_status,
    check_anchor, verify_attestation, lookup_certificate (public, no credential) plus authorize, complete_authorization,
    attest_hash, create_certificate_pdf (credentialed). Credentials via device flow or an Authorization:
    Bearer sg_k_… header. File bytes are never accepted as tool arguments.
